<!-- @dsCard group="Scene" height=300 -->
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>body{margin:0;background:var(--void);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5}.wrap{padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style>
<svg viewBox="-320 -300 560 380" style="display:block;width:100%">
<defs>
  <filter id="no-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="no-bloom" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="no-beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:var(--magenta)"/><stop offset="1" style="stop-color:var(--cyan)"/></linearGradient>
</defs>
<g id="root"></g>
</svg>
<script>
const K=26,C=.866,P=(x,y,z=0)=>[(x-y)*K*C,(x+y)*K*.5-z*K],pts=l=>l.map(p=>p.map(v=>v.toFixed(1)).join(",")).join(" ");
const room = { name: "Shop web", kind: "code", x0: -9, y0: -7, w: 9, h: 7 };
const x1 = room.x0 + room.w, y1 = room.y0 + room.h, t = 0.35;
const top = [P(room.x0, room.y0), P(x1, room.y0), P(x1, y1), P(room.x0, y1)];
function desk(cx, cy, w = 1.7, d = 1.1, h = 0.5) {
  const a = cx - w / 2, b = cx + w / 2, c = cy - d / 2, e = cy + d / 2;
  return `<polygon class="no-desk-r" points="${pts([P(b, c, h), P(b, e, h), P(b, e, 0), P(b, c, 0)])}"/>
    <polygon class="no-desk-l" points="${pts([P(a, e, h), P(b, e, h), P(b, e, 0), P(a, e, 0)])}"/>
    <polygon class="no-desk-top" points="${pts([P(a, c, h), P(b, c, h), P(b, e, h), P(a, e, h)])}"/>
    <polygon class="no-screen" points="${pts([P(a + .25, c + .2, h), P(b - .25, c + .2, h), P(b - .25, c + .2, h + .55), P(a + .25, c + .2, h + .55)])}"/>`;
}
const [lx, ly] = P(room.x0 + 0.5, y1 - 0.55), [hx, hy] = P(room.x0, room.y0), hw = 150;
document.getElementById("root").innerHTML = `<g class="no-room k-${room.kind}">
  <polygon class="no-plat-side" points="${pts([P(x1, room.y0), P(x1, y1), P(x1, y1, -t), P(x1, room.y0, -t)])}"/>
  <polygon class="no-plat-side" style="opacity:.75" points="${pts([P(room.x0, y1), P(x1, y1), P(x1, y1, -t), P(room.x0, y1, -t)])}"/>
  <polygon class="no-plat-glow" points="${pts(top)}"/><polygon class="no-plat-top" points="${pts(top)}"/>
  <text class="no-floor-text" transform="matrix(${C} .5 -${C} .5 ${lx.toFixed(1)} ${ly.toFixed(1)})">SHOP WEB</text>
  ${desk(-7, -5)}${desk(-4, -5)}${desk(-7, -2)}${desk(-4, -2)}
  <g transform="translate(${hx - hw / 2} ${hy - 62})"><path class="no-hud-bg" d="M0 0 H${hw - 8} L${hw} 8 V44 H8 L0 36 Z"/>
    <text class="no-hud-name" x="11" y="19">Shop web</text>
    <text x="11" y="35"><tspan class="no-hud-kind">code</tspan><tspan class="no-hud-meta" dx="10">lượt 6/13</tspan></text></g>
</g>`;
</script>
